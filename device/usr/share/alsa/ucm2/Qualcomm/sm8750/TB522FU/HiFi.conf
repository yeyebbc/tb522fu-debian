SectionVerb {
    Value { TQ "HiFi" }
    # PipeWire probes the PCM before the device EnableSequence runs.
    EnableSequence [
        cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 1"
        cset "name='Spkr0 Playback Volume' 767"
        cset "name='Spkr1 Playback Volume' 767"
        cset "name='Spkr2 Playback Volume' 767"
        cset "name='Spkr3 Playback Volume' 767"
        cset "name='Spkr4 Playback Volume' 767"
        cset "name='Spkr5 Playback Volume' 767"
        # ACP prepares capture before a device EnableSequence. The graph and
        # SoundWire channels must already exist; DAPM powers them only on use.
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX DEC1 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC0"
        cset "name='TX SMIC MUX1' SWR_MIC1"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
        # +12 dB capture boost; independent of speaker gain and desktop volume.
        cset "name='TX_DEC0 Volume' 96"
        cset "name='TX_DEC1 Volume' 96"
        cset "name='ADC1 MUX' CH1_AMIC1"
        cset "name='ADC2 MUX' CH2_AMIC3"
        cset "name='ADC1 Volume' 8"
        cset "name='ADC2 Volume' 8"
        cset "name='ADC1 Switch' 1"
        cset "name='ADC2 Switch' 1"
        cset "name='ADC1_MIXER Switch' 1"
        cset "name='ADC2_MIXER Switch' 1"
    ]
    DisableSequence [
        cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 0"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='ADC1 Switch' 0"
        cset "name='ADC2 Switch' 0"
    ]
}

SectionDevice."Mic" {
    Comment "Internal microphones"
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
    }
}

SectionDevice."Speaker" {
    Comment "Internal speakers"
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
    EnableSequence [
        cset "name='Speaker0 Switch' 1"
        cset "name='Speaker1 Switch' 1"
        cset "name='Speaker2 Switch' 1"
        cset "name='Speaker3 Switch' 1"
        cset "name='Speaker4 Switch' 1"
        cset "name='Speaker5 Switch' 1"
    ]
    DisableSequence [
        cset "name='Speaker0 Switch' 0"
        cset "name='Speaker1 Switch' 0"
        cset "name='Speaker2 Switch' 0"
        cset "name='Speaker3 Switch' 0"
        cset "name='Speaker4 Switch' 0"
        cset "name='Speaker5 Switch' 0"
    ]
}
