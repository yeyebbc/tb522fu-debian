# SPDX-License-Identifier: BSD-3-Clause
SectionVerb {
    Value { TQ "HiFi" }
    # PipeWire probes the PCM before the device EnableSequence runs.
    EnableSequence [
        cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 1"
        cset "name='Spkr0 Playback Volume' 767"
        cset "name='Spkr1 Playback Volume' 767"
        cset "name='Spkr2 Playback Volume' 767"
        cset "name='Spkr3 Playback Volume' 767"
        cset "name='Spkr4 Playback Volume' 767"
        cset "name='Spkr5 Playback Volume' 767"
    ]
    DisableSequence [
        cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 0"
    ]
}

SectionDevice."Speaker" {
    Comment "Internal speakers"
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
    EnableSequence [
        cset "name='Speaker0 Switch' 1"
        cset "name='Speaker1 Switch' 1"
        cset "name='Speaker2 Switch' 1"
        cset "name='Speaker3 Switch' 1"
        cset "name='Speaker4 Switch' 1"
        cset "name='Speaker5 Switch' 1"
    ]
    DisableSequence [
        cset "name='Speaker0 Switch' 0"
        cset "name='Speaker1 Switch' 0"
        cset "name='Speaker2 Switch' 0"
        cset "name='Speaker3 Switch' 0"
        cset "name='Speaker4 Switch' 0"
        cset "name='Speaker5 Switch' 0"
    ]
}
