name: Build Fedora45 ARM64 graphics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphics:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container: registry.fedoraproject.org/fedora@sha256:8430348a73c5a0e607b5de2cf9dd4741d9aa0891bbce3108588298102015f8c6
    steps:
      - name: Install Fedora-native build dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install git ca-certificates gcc gcc-c++ meson ninja-build pkgconf-pkg-config python3 python3-mako python3-pyyaml python3-packaging bison flex libdrm-devel expat-devel libzstd-devel zlib-ng-compat-devel libglvnd-devel wayland-devel wayland-protocols-devel libX11-devel libXext-devel libXfixes-devel libXrandr-devel libxshmfence-devel libXxf86vm-devel libxcb-devel llvm-devel elfutils-libelf-devel libunwind-devel systemd-devel vulkan-loader-devel spirv-tools-devel spirv-headers glslang python3-ply python3-pycparser python3-setuptools libdisplay-info-devel libpng-devel lm_sensors-devel cmake zstd patch xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record native dependency versions
        run: |
          mkdir -p artifacts/graphics
          rpm -q glibc libstdc++ libdrm llvm-libs libglvnd > artifacts/graphics/fedora-dependencies.txt
      - name: Build pinned Mesa with the upstream A830v1 ID
        run: python3 scripts/build-graphics.py --source-spec configs/graphics/source-fedora45.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphics-fedora45-arm64
          path: artifacts/graphics/
          if-no-files-found: error
          retention-days: 7
