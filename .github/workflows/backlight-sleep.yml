name: Build GNOME backlight-only Suspend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GNOME screen-only Suspend behavior
        run: |
          node --check device/gnome-backlight-sleep/extension.js
          node --experimental-vm-modules tests/test_gnome_backlight_sleep.mjs
      - name: Package the committed extension
        run: python3 scripts/build-gnome-backlight-sleep.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnome-backlight-sleep
          path: artifacts/backlight-sleep/
          if-no-files-found: error
          retention-days: 7
