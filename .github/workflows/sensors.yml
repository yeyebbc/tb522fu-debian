name: Build ARM64 sensor services

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensors:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential meson ninja-build pkg-config python3 python3-gi protobuf-compiler protobuf-c-compiler libprotobuf-c-dev libglib2.0-dev libqmi-glib-dev libgudev-1.0-dev libpolkit-gobject-1-dev libgirepository1.0-dev gir1.2-qmi-1.0 gir1.2-qrtr-1.0 valac zstd file
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned sensor services
        run: python3 scripts/build-sensors.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sensors-arm64
          path: artifacts/sensors/
          if-no-files-found: error
          retention-days: 7
