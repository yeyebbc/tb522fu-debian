name: Build ARM64 graphics stack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphics:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential meson ninja-build pkg-config python3 python3-mako python3-yaml python3-packaging bison flex libdrm-dev libexpat1-dev libzstd-dev zlib1g-dev libglvnd-dev libwayland-dev libwayland-egl-backend-dev wayland-protocols libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxshmfence-dev libxxf86vm-dev libxcb-glx0-dev libxcb-shm0-dev libxcb-present-dev libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-dri2-0-dev libxcb-dri3-dev libx11-xcb-dev llvm-19-dev libelf-dev libunwind-dev libudev-dev libvulkan-dev spirv-tools spirv-headers glslang-tools python3-ply python3-pycparser python3-setuptools libdisplay-info-dev libpng-dev libsensors-dev cmake zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned Mesa and hardware rendering probe
        run: python3 scripts/build-graphics.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphics-arm64
          path: artifacts/graphics/
          if-no-files-found: error
          retention-days: 7
