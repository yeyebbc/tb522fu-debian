name: Build ARM64 artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_rootfs:
        description: Rebuild the Debian base filesystem
        type: boolean
        default: false
      build_audio:
        description: Rebuild the audio topology explicitly
        type: boolean
        default: false
      trial_root:
        description: Root for the bounded disk test; installed selection stays Debian
        type: choice
        options: [debian, ubuntu-test, fedora45-test, maintenance]
        default: debian

permissions:
  contents: read

concurrency:
  group: arm64-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backlight-sleep:
    name: GNOME backlight-only rollback package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check and package the working GNOME action
        run: |
          node --check device/gnome-backlight-sleep/extension.js
          node --experimental-vm-modules tests/test_gnome_backlight_sleep.mjs
          python3 scripts/build-gnome-backlight-sleep.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnome-backlight-sleep
          path: artifacts/backlight-sleep/
          if-no-files-found: error
          retention-days: 7

  display-power:
    name: ARM64 backlight compatibility overlay
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    container: debian:trixie
    steps:
      - name: Install adapter build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates gcc libc6-dev binutils python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check backlight authorization and mode switching
        run: python3 -m unittest discover -s tests -p 'test_display_power*.py' -v
      - name: Build the ARM64 overlay
        run: python3 scripts/build-display-power.py --cc gcc --output artifacts/display-power
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: display-power-aarch64
          path: |
            artifacts/display-power/display-power.tar
            artifacts/display-power/manifest.json
            artifacts/display-power/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  kernel:
    name: Kernel (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [disk-test, installed]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential bc bison flex libssl-dev libelf-dev ccache device-tree-compiler busybox-static cpio python3 zstd kmod e2fsprogs util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: arm64-kernel-${{ matrix.profile }}-${{ hashFiles('kernel/source.json', 'configs/*', 'patches/*.patch', 'scripts/build-kernel.py') }}
          restore-keys: |
            arm64-kernel-${{ matrix.profile }}-
            arm64-kernel-
      - name: Check root selection and maintenance guards
        run: python3 -m unittest discover -s tests -v
      - name: Build the pinned kernel and initramfs
        env:
          ROOT_ENVIRONMENT: ${{ matrix.profile == 'disk-test' && inputs.trial_root || 'debian' }}
        run: python3 scripts/build-kernel.py --profile '${{ matrix.profile }}' --root-environment "$ROOT_ENVIRONMENT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-${{ matrix.profile }}
          path: artifacts/kernel/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-source-${{ matrix.profile }}
          path: artifacts/kernel-source.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  audio:
    if: github.event_name == 'workflow_dispatch' && inputs.build_audio
    name: Audio topology
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container: debian:trixie
    steps:
      - name: Install topology tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 m4 alsa-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and inspect the pinned audio topology
        run: python3 scripts/build-audio-topology.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-topology
          path: artifacts/audio/
          if-no-files-found: error
          retention-days: 7

  rootfs:
    if: github.event_name == 'workflow_dispatch' && inputs.build_rootfs
    name: Debian 13 GNOME root filesystem
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install root filesystem tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates mmdebstrap debian-archive-keyring python3 zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Debian natively from signed archives
        run: python3 scripts/build-rootfs.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian13-arm64-gnome
          path: artifacts/rootfs/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
